<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>AMINUL URL TIMER - MULTI NUMBER</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#172c50,#080d1b 65%);
  font-family:Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:25px;
  padding:25px 20px;
  box-shadow:0 20px 60px #0008;
  backdrop-filter:blur(20px);
}

.header{text-align:center;margin-bottom:20px}

.logo{
  width:65px;height:65px;border-radius:20px;
  background:linear-gradient(135deg,#00d4ff,#635bff);
  display:flex;justify-content:center;align-items:center;
  font-size:30px;margin:0 auto 12px;
  box-shadow:0 0 30px #00cfff55;
}

.header h1{font-size:23px;letter-spacing:1px}
.header p{color:#94a3b8;font-size:12px;margin-top:6px}

.mode-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:18px;background:#0b1427;padding:4px;border-radius:14px;
  border:1px solid #1e2f4a;
}
.mode-tab{
  background:transparent;border:0;color:#94a3b8;font-size:12px;
  font-weight:bold;padding:10px;border-radius:10px;cursor:pointer;transition:.2s;
}
.mode-tab.active{
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  color:#fff;box-shadow:0 4px 15px #0ea5e944;
}

.label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:8px}

.input-box{
  background:#0b1427;
  border:1px solid #263957;
  border-radius:13px;
  padding:0 15px;
  display:flex;
  align-items:center;
  margin-bottom:12px;
}

.input-box span{color:#38bdf8;font-size:18px}

input, textarea{
  width:100%;background:transparent;border:0;outline:none;
  color:white;padding:15px 10px;font-size:16px;
  font-variant-numeric:tabular-nums;
  resize:none;font-family:Arial,sans-serif;
}
input:disabled, textarea:disabled{opacity:.55}

.multi-section{display:none}
.multi-section.active{display:block}
.single-section{display:block}
.single-section.hidden{display:none}

.number-list-container{
  background:#0b1427;border:1px solid #1e2f4a;border-radius:13px;
  padding:10px;max-height:130px;overflow-y:auto;margin-bottom:12px;
}
.number-list-container::-webkit-scrollbar{width:4px}
.number-list-container::-webkit-scrollbar-thumb{background:#263957;border-radius:4px}
.number-item{
  display:flex;justify-content:space-between;align-items:center;
  background:#14233d;padding:6px 10px;border-radius:8px;margin-bottom:6px;
  font-size:13px;font-variant-numeric:tabular-nums;
}
.number-item button{
  background:#ef4444;border:0;color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;
}

.add-row{display:flex;gap:8px;margin-bottom:12px}
.add-btn{
  background:linear-gradient(135deg,#10b981,#059669);border:0;border-radius:13px;
  padding:0 18px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer;
}

.timer-box{
  margin:18px 0 15px;
  padding:20px 10px;
  background:linear-gradient(145deg,#14233d,#0b1427);
  border:1px solid #263957;
  border-radius:20px;
  text-align:center;
}

.timer-title{color:#94a3b8;font-size:11px;letter-spacing:2px}

.timer{
  font-size:56px;font-weight:bold;margin:8px 0;
  color:#38bdf8;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 25px #38bdf855;
  transition:color .3s;
}

.status{
  display:flex;justify-content:center;align-items:center;
  gap:8px;color:#94a3b8;font-size:12px;
  min-height:16px;
}

.dot{
  width:8px;height:8px;border-radius:50%;
  background:#64748b;transition:.3s;
}

.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;
}
.stat{
  background:#0b1427;border:1px solid #1e2f4a;border-radius:12px;
  padding:10px;text-align:center;
}
.stat span{display:block;color:#7d8ea8;font-size:10px;letter-spacing:1px}
.stat b{display:block;margin-top:4px;font-size:16px;color:#38bdf8}

.log-box{
  background:#0b1427;border:1px solid #1e2f4a;border-radius:13px;
  padding:12px;margin-bottom:15px;
}
.log-title{color:#7d8ea8;font-size:10px;letter-spacing:2px;margin-bottom:8px}
.log{max-height:100px;overflow-y:auto;font-size:11px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:#263957;border-radius:4px}
.log-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:4px 0;border-bottom:1px dashed #16233a;
}
.log-row:last-child{border-bottom:0}
.log-time{color:#64748b;font-variant-numeric:tabular-nums}
.log-empty{color:#475569;text-align:center;padding:6px 0}

.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button.ctrl-btn{
  border:0;border-radius:13px;padding:14px 10px;
  font-size:14px;font-weight:bold;cursor:pointer;
  transition:.2s;color:#fff;
}
button.ctrl-btn:active:not(:disabled){transform:scale(.96)}
button.ctrl-btn:disabled{opacity:.4;cursor:not-allowed}

.start{background:linear-gradient(135deg,#10b981,#059669)}
.stop{background:linear-gradient(135deg,#ef4444,#dc2626)}
.reset{background:#263957}
.open{background:linear-gradient(135deg,#0ea5e9,#2563eb);grid-column:span 2}

.footer{text-align:center;color:#64748b;font-size:11px;margin-top:18px}
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="logo">⚡</div>
    <h1>AMINUL TIMER</h1>
    <p>MULTI-NUMBER URL TIMER DASHBOARD</p>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="singleTab" onclick="switchMode('single')">👤 Single Number</button>
    <button class="mode-tab" id="multiTab" onclick="switchMode('multi')">👥 Multi-Number List</button>
  </div>

  <!-- Single Number Mode -->
  <div class="single-section" id="singleSection">
    <label class="label">MOBILE NUMBER</label>
    <div class="input-box">
      <span>📱</span>
      <input type="tel" id="number" placeholder="017XXXXXXXX" maxlength="11">
    </div>
  </div>

  <!-- Multi Number Mode -->
  <div class="multi-section" id="multiSection">
    <label class="label">ADD MOBILE NUMBER</label>
    <div class="add-row">
      <div class="input-box" style="margin-bottom:0;flex:1">
        <span>📱</span>
        <input type="tel" id="newNumber" placeholder="017XXXXXXXX" maxlength="11">
      </div>
      <button class="add-btn" onclick="addNumber()">+ Add</button>
    </div>
    <label class="label" style="margin-top:8px">SAVED NUMBERS (<span id="countBadge">0</span>)</label>
    <div class="number-list-container" id="numberListContainer">
      <div class="log-empty">No numbers added yet</div>
    </div>
  </div>

  <div class="timer-box">
    <div class="timer-title">NEXT AUTO CHECK IN</div>
    <div class="timer" id="timer">01:00</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">READY TO START</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>TOTAL CHECKS</span><b id="checks">0</b></div>
    <div class="stat"><span>INTERVAL</span><b>60s</b></div>
  </div>

  <div class="log-box">
    <div class="log-title">ACTIVITY LOG</div>
    <div class="log" id="log">
      <div class="log-empty">No activity yet</div>
    </div>
  </div>

  <div class="buttons">
    <button class="ctrl-btn start" id="startBtn" onclick="startTimer()">▶ START</button>
    <button class="ctrl-btn stop" id="stopBtn" onclick="stopTimer()" disabled>■ STOP</button>
    <button class="ctrl-btn reset" onclick="resetTimer()">↻ RESET</button>
    <button class="ctrl-btn open" onclick="openURL()">🌐 OPEN URL NOW</button>
  </div>

  <div class="footer">MADE WITH ❤️ BY AMINULSORDAR</div>
</div>

<script src="index.js" defer></script>
</body>
</html>
